<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Révisions CE2 - Orthographe, Maths & Anglais</title>
  <!-- Fichier CSS compilé à partir de styles.scss -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    <header>
      <h1>✏️ Mes Exercices CE2 📚</h1>
      <p>Entraîne-toi et vérifie tes réponses !</p>
    </header>

    <!-- Navigation Onglets Principaux -->
    <nav class="tabs-nav">
      <button class="tab-btn active" data-tab="orthographe">Orthographe</button>
      <button class="tab-btn" data-tab="maths">Mathématiques</button>
      <button class="tab-btn" data-tab="anglais">Anglais</button>
    </nav>

    <!-- Onglet 1 : Orthographe -->
    <section id="tab-orthographe" class="tab-content active">
      <div style="text-align: right; margin-bottom: 10px;">
        <button id="btn-restart-ortho" class="btn-restart">🔄 Recommencer</button>
      </div>
      <h2>Son [s] et [z] : écriture avec "s" ou "ss"</h2>
      <p style="margin-bottom: 1rem; color: #475569;">Complète les mots avec <strong>s</strong> ou <strong>ss</strong> :</p>
      
      <div id="ortho-container" class="words-grid"></div>

      <div class="action-bar">
        <button id="btn-validate-ortho" class="btn-submit">Valider</button>
        <div id="ortho-score" class="score-display"></div>
      </div>
    </section>

    <!-- Onglet 2 : Mathématiques -->
    <section id="tab-maths" class="tab-content">
      <div class="exercise-selector">
        <button class="subtab-btn active" data-type="operations">Opérations</button>
        <button class="subtab-btn" data-type="perimetres">Périmètres</button>
        <button class="subtab-btn" data-type="fractions">Fractions</button>
        <button class="subtab-btn" data-type="problemes">Problèmes</button>
        <button class="subtab-btn" data-type="numeration">Nombres</button>
      </div>
      <button id="btn-restart-maths" class="btn-restart">🔄 Recommencer</button>
      <div id="maths-container" class="maths-grid"></div>

      <div class="action-bar">
        <button id="btn-validate-maths" class="btn-submit">Vérifier</button>
        <div id="maths-score" class="score-display"></div>
      </div>
    </section>

    <!-- Onglet 3 : Anglais -->
    <section id="tab-anglais" class="tab-content">
      <h2>Jours et Mois en Anglais / Français</h2>
      <div style="text-align: right; margin-bottom: 10px;">
        <button id="btn-restart-anglais" class="btn-restart">🔄 Recommencer</button>
      </div>
      <div id="english-container" class="english-grid"></div>

      <div class="action-bar">
        <button id="btn-validate-english" class="btn-submit">Vérifier</button>
        <div id="english-score" class="score-display"></div>
      </div>
    </section>
  </div>

  <!-- Script principal JS -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
